# ---- OBI unprivileged SCC ------------------------------------------------
# Allows the OBI collector DaemonSet to load eBPF programs with fine-grained
# capabilities instead of a fully privileged container.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: obi-unprivileged
  annotations:
    kubernetes.io/description: Allows OBI collectors to run with fine-grained eBPF capabilities without full privileges
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
allowHostPorts: true
allowHostDirVolumePlugin: true
allowHostIPC: false
allowHostNetwork: true
allowHostPID: true
allowPrivilegedContainer: false
readOnlyRootFilesystem: true
allowedCapabilities:
  - BPF
  - SYS_PTRACE
  - NET_RAW
  - CHECKPOINT_RESTORE
  - DAC_READ_SEARCH
  - PERFMON
  - NET_ADMIN
  - SYS_ADMIN
volumes:
  - emptyDir
  - hostPath
  - configMap
  - secret
  - downwardAPI
  - projected

# ---- Cluster Observability Operator (COO) --------------------------------
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-cluster-observability
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cluster-observability-operator-group
  namespace: openshift-cluster-observability
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-observability-operator
  namespace: openshift-cluster-observability
spec:
  channel: stable
  installPlanApproval: Automatic
  name: cluster-observability-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace

